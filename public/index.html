 <!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARZ BOSS TIMER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0b0e14;
        }
        .font-gaming {
            font-family: 'Orbitron', sans-serif;
        }
        .glass-card {
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .card-locked {
            background: rgba(15, 20, 30, 0.6) !important;
            border: 1px solid rgba(245, 158, 11, 0.2) !important;
            opacity: 0.75;
        }
        .card-locked:hover {
            opacity: 1;
            border-color: rgba(245, 158, 11, 0.5) !important;
        }

        .card-green {
            background: rgba(6, 78, 59, 0.25) !important;
            border: 1px solid #10b981 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
        }
        .card-yellow {
            background: rgba(120, 53, 15, 0.25) !important;
            border: 1px solid #f59e0b !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
        }
        .card-red {
            background: rgba(136, 19, 55, 0.25) !important;
            border: 1px solid #f43f5e !important;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.25);
        }

        @keyframes flashRedBorder {
            0%, 100% {
                border-color: #f43f5e;
                box-shadow: 0 0 20px rgba(244, 63, 94, 0.8);
                background: rgba(225, 29, 72, 0.35);
            }
            50% {
                border-color: rgba(255, 255, 255, 0.1);
                box-shadow: none;
                background: rgba(18, 24, 38, 0.85);
            }
        }
        .card-flash-red {
            animation: flashRedBorder 1s infinite;
        }

        .active-tab-red {
            background: rgba(225, 29, 72, 0.15);
            border: 1px solid #e11d48 !important;
            color: #f43f5e !important;
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.3);
        }
        .active-tab-blue {
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid #0ea5e9 !important;
            color: #38bdf8 !important;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.3);
        }
        .active-city {
            border: 1px solid #38bdf8 !important;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen pb-12 relative">

    <header class="text-center pt-8 pb-4">
        <h1 class="text-3xl md:text-4xl font-black font-gaming tracking-wider text-rose-500 drop-shadow-[0_0_10px_rgba(244,63,94,0.4)]">
            WARZ BOSS TIMER
        </h1>
        
        <div class="inline-flex items-center gap-2 mt-2 px-3 py-1 bg-slate-900 border border-slate-800 rounded-md text-xs font-gaming">
            <span class="relative flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
            </span>
            <span class="text-slate-300">ONLINE: <span id="online-count" class="text-emerald-400 font-bold">1</span> USER(S)</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4">
        
        <div class="flex justify-center gap-3 mb-6">
            <button id="tab-premium" onclick="selectServerType('Premium')" 
                class="active-tab-red px-6 py-2.5 rounded-lg text-sm font-bold font-gaming transition-all duration-200">
                PREMIUM SERVER (50ห้อง)
            </button>
            <button id="tab-official" onclick="selectServerType('Official')" 
                class="px-6 py-2.5 rounded-lg text-sm font-bold font-gaming transition-all duration-200 border border-slate-800 text-slate-400 bg-slate-900/50">
                OFFICIAL SERVER (50ห้อง)
            </button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <button onclick="selectCity('Norad Military Base')" id="city-Norad Military Base" class="active-city glass-card p-3 rounded-lg text-center transition hover:bg-slate-800/80">
                <div class="text-lg">🏢</div>
                <div class="text-xs font-bold font-gaming mt-1">Norad Military Base</div>
            </button>
            <button onclick="selectCity('Ridgeway Airport')" id="city-Ridgeway Airport" class="glass-card p-3 rounded-lg text-center transition hover:bg-slate-800/80">
                <div class="text-lg">✈️</div>
                <div class="text-xs font-bold font-gaming mt-1">Ridgeway Airport</div>
            </button>
            <button onclick="selectCity('Crystal Lake Resort')" id="city-Crystal Lake Resort" class="glass-card p-3 rounded-lg text-center transition hover:bg-slate-800/80">
                <div class="text-lg">🏠</div>
                <div class="text-xs font-bold font-gaming mt-1">Crystal Lake Resort</div>
            </button>
            <button onclick="selectCity('Campos City')" id="city-Campos City" class="glass-card p-3 rounded-lg text-center transition hover:bg-slate-800/80">
                <div class="text-lg">🏙️</div>
                <div class="text-xs font-bold font-gaming mt-1">Campos City</div>
            </button>
        </div>

        <div class="text-center mb-6">
            <span class="text-rose-500 text-sm font-bold tracking-wide font-gaming inline-flex items-center gap-1.5">
                📍 <span id="current-location-text">Norad Military Base</span>
            </span>
        </div>

        <div id="boss-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    </main>

    <!-- Modal แจ้งเตือนปลดล็อก VIP -->
    <div id="vip-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-amber-500/40 rounded-2xl max-w-md w-full p-6 text-center shadow-[0_0_30px_rgba(245,158,11,0.2)]">
            <div class="text-4xl mb-3">🔒</div>
            <h3 class="text-xl font-bold font-gaming text-amber-400 mb-2">ปลดล็อกห้อง VIP</h3>
            <p class="text-sm text-slate-300 mb-4">
                ห้องนี้ถูกล็อคไว้เฉพาะสมาชิก VIP<br>
                หากต้องการปลดล็อกใช้งานห้องนี้ หรือเช่าห้องแบบส่วนตัว<br>
                สามารถติดต่อแอดมินเพื่อชำระเงินได้ทันที!
            </p>
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-left mb-6 font-mono text-xs text-slate-400 space-y-1">
                <p>💬 Discord: <span class="text-amber-400 font-bold">VALENTILE</span></p>
                <p>⚡ สถานะ: เปิดรับปลดล็อกรายห้อง / ถาวร</p>
            </div>
            <div class="flex gap-2">
                <button onclick="closeVipModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-sm transition">
                    ปิดหน้าต่าง
                </button>
                <a href="https://discord.gg/XgwRMhg7hB" target="_blank" onclick="closeVipModal()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold font-gaming py-2 rounded-xl text-sm transition text-center flex items-center justify-center">
                    ติดต่อแอดมิน
                </a>
            </div>
        </div>
    </div>

    <script>
        let myUserId = localStorage.getItem('warz_user_id');
        if (!myUserId) {
            myUserId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('warz_user_id', myUserId);
        }

        let currentDiscordUser = localStorage.getItem('discord_username') || "VALENTILE";

        let currentType = 'Premium';
        let currentCity = 'Norad Military Base';
        
        let bossesData = [];
        let serverTimeOffset = 0;
        let playedAlerts = new Set();

        function playBossSpawnSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.value = 880;
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(audioCtx.currentTime);
                osc1.stop(audioCtx.currentTime + 0.15);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.value = 1200;
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(audioCtx.currentTime + 0.18);
                osc2.stop(audioCtx.currentTime + 0.4);
            } catch (e) {
                console.log("Audio blocked:", e);
            }
        }

        function openVipModal() {
            document.getElementById('vip-modal').classList.remove('hidden');
        }

        function closeVipModal() {
            document.getElementById('vip-modal').classList.add('hidden');
        }

        function selectServerType(type) {
            currentType = type;
            const btnPrem = document.getElementById('tab-premium');
            const btnOff = document.getElementById('tab-official');

            if (type === 'Premium') {
                btnPrem.className = "active-tab-red px-6 py-2.5 rounded-lg text-sm font-bold font-gaming transition-all duration-200";
                btnOff.className = "px-6 py-2.5 rounded-lg text-sm font-bold font-gaming transition-all duration-200 border border-slate-800 text-slate-400 bg-slate-900/50";
            } else {
                btnOff.className = "active-tab-blue px-6 py-2.5 rounded-lg text-sm font-bold font-gaming transition-all duration-200";
                btnPrem.className = "px-6 py-2.5 rounded-lg text-sm font-bold font-gaming transition-all duration-200 border border-slate-800 text-slate-400 bg-slate-900/50";
            }
            fetchBosses();
        }

        function selectCity(cityName) {
            currentCity = cityName;
            document.getElementById('current-location-text').innerText = cityName;

            const cities = ['Norad Military Base', 'Ridgeway Airport', 'Crystal Lake Resort', 'Campos City'];
            cities.forEach(c => {
                const el = document.getElementById(`city-${c}`);
                if (c === cityName) el.classList.add('active-city');
                else el.classList.remove('active-city');
            });
            fetchBosses();
        }

        async function fetchBosses() {
            const url = `/api/bosses?serverType=${currentType}&location=${encodeURIComponent(currentCity)}&userId=${myUserId}&username=${encodeURIComponent(currentDiscordUser)}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                serverTimeOffset = data.serverTime - Date.now();
                bossesData = data.bosses;
                
                if (data.onlineCount) {
                    document.getElementById('online-count').innerText = data.onlineCount;
                }
                
                renderBossGrid();
            } catch(e) {
                console.error("Error fetching bosses:", e);
            }
        }

        async function spawnBoss(id) {
            localStorage.setItem(`my_spawn_${id}`, 'true');

            await fetch('/api/bosses/spawn', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, username: currentDiscordUser, userId: myUserId })
            });
            fetchBosses();
        }

        async function resetBoss(id) {
            localStorage.removeItem(`my_spawn_${id}`);
            playedAlerts.delete(id);

            await fetch('/api/bosses/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            fetchBosses();
        }

        async function undoBoss(id) {
            localStorage.setItem(`my_spawn_${id}`, 'true');

            const res = await fetch('/api/bosses/undo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, username: currentDiscordUser })
            });
            const data = await res.json();
            if (!data.success) alert(data.message);
            fetchBosses();
        }

        function renderBossGrid() {
            const container = document.getElementById('boss-grid');
            if (bossesData.length === 0) return;
            
            container.innerHTML = '';

            bossesData.forEach(boss => {
                const card = document.createElement('div');
                
                if (boss.isLocked) {
                    card.className = "glass-card card-locked rounded-lg p-4 flex flex-col justify-between text-center relative overflow-hidden";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-bold font-gaming text-slate-400 tracking-wider">
                                    TH ${boss.serverName.toUpperCase()}
                                </span>
                                <span class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-1.5 py-0.5 rounded font-bold">🔒 VIP LOCKED</span>
                            </div>
                            
                            <div class="text-xl font-bold font-gaming text-amber-500/60 my-4 tracking-widest flex items-center justify-center gap-2">
                                <span>🔒</span> <span>LOCKED</span>
                            </div>
                        </div>

                        <div class="mt-2 border-t border-slate-800/80 pt-3">
                            <button onclick="openVipModal()" class="w-full bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded py-1.5 text-xs font-bold font-gaming transition">
                                🔓 ติดต่อปลดล็อกห้อง
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                    return;
                }

                let timerDisplay = "00:00:00";
                let timerColor = "text-slate-600";
                let inUse = false;
                let canUndo = false;
                let cardStyleClass = "glass-card";
                let badgeClass = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";

                const now = Date.now() + serverTimeOffset;

                if (boss.nextSpawn) {
                    const spawnTime = new Date(boss.nextSpawn).getTime();
                    const diff = spawnTime - now;

                    if (diff > 0) {
                        inUse = true;
                        let totalSeconds = Math.floor(diff / 1000);
                        if (totalSeconds >= 3600) totalSeconds = 3599;

                        const hours = Math.floor(totalSeconds / 3600);
                        const minutes = Math.floor((totalSeconds % 3600) / 60);
                        const seconds = totalSeconds % 60;

                        timerDisplay = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                        if (totalSeconds > 1800) {
                            cardStyleClass = "glass-card card-green";
                            timerColor = "text-emerald-400 font-bold";
                            badgeClass = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
                        } else if (totalSeconds > 600) {
                            cardStyleClass = "glass-card card-yellow";
                            timerColor = "text-amber-400 font-bold";
                            badgeClass = "bg-amber-500/20 text-amber-400 border-amber-500/30";
                        } else if (totalSeconds > 10) {
                            cardStyleClass = "glass-card card-red";
                            timerColor = "text-rose-400 font-bold";
                            badgeClass = "bg-rose-500/20 text-rose-400 border-rose-500/30";
                        } else {
                            cardStyleClass = "glass-card card-flash-red";
                            timerColor = "text-rose-400 font-bold animate-pulse";
                            badgeClass = "bg-rose-500/40 text-rose-300 border-rose-400";
                        }

                    } else {
                        timerDisplay = "READY!";
                        timerColor = "text-emerald-400 font-bold animate-pulse";
                        cardStyleClass = "glass-card";

                        const isMySpawn = localStorage.getItem(`my_spawn_${boss.id}`) === 'true';
                        if (isMySpawn && !playedAlerts.has(boss.id)) {
                            playBossSpawnSound();
                            playedAlerts.add(boss.id);
                        }
                    }
                } else {
                    localStorage.removeItem(`my_spawn_${boss.id}`);
                    playedAlerts.delete(boss.id);
                }

                if (boss.resetAt && boss.previousNextSpawn) {
                    const resetTime = new Date(boss.resetAt).getTime();
                    const diffResetMinutes = (now - resetTime) / (1000 * 60);
                    if (diffResetMinutes <= 3) {
                        canUndo = true;
                    }
                }

                card.className = `${cardStyleClass} rounded-lg p-4 flex flex-col justify-between text-center relative overflow-hidden`;

                const spawnBtnAttr = inUse ? "disabled" : `onclick="spawnBoss(${boss.id})"`;
                const spawnBtnClass = inUse 
                    ? "bg-slate-800 text-slate-600 border border-slate-700/50 cursor-not-allowed opacity-50" 
                    : "bg-emerald-950/80 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/40 hover:border-emerald-500 cursor-pointer";

                const undoBtnAttr = canUndo ? `onclick="undoBoss(${boss.id})"` : "disabled";
                const undoBtnClass = canUndo 
                    ? "bg-amber-950/80 hover:bg-amber-600/30 text-amber-400 border border-amber-500/40 hover:border-amber-500 cursor-pointer animate-pulse" 
                    : "bg-slate-900 text-slate-700 border border-slate-800 cursor-not-allowed opacity-40";

                const resetBtnAttr = inUse ? `onclick="resetBoss(${boss.id})"` : "disabled";
                const resetBtnClass = inUse 
                    ? "bg-rose-950/80 hover:bg-rose-600/30 text-rose-400 border border-rose-500/40 hover:border-rose-500 cursor-pointer" 
                    : "bg-slate-900 text-slate-700 border border-slate-800 cursor-not-allowed opacity-40";

                const userBadge = inUse && boss.createdBy 
                    ? `<span class="text-[10px] border px-2 py-0.5 rounded font-bold max-w-[110px] truncate ${badgeClass}">👤 ${boss.createdBy}</span>` 
                    : '';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold font-gaming text-slate-300 tracking-wider">
                                TH ${boss.serverName.toUpperCase()}
                            </span>
                            ${userBadge}
                        </div>
                        
                        <div class="text-2xl font-black font-gaming ${timerColor} my-3 tracking-widest drop-shadow-[0_0_8px_rgba(16,185,129,0.2)]">
                            ${timerDisplay}
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-1.5 mt-2 border-t border-slate-800/80 pt-3">
                        <button ${spawnBtnAttr} class="${spawnBtnClass} rounded py-1 text-[11px] font-bold font-gaming transition">
                            SPAWN
                        </button>
                        <button ${undoBtnAttr} class="${undoBtnClass} rounded py-1 text-[11px] font-bold font-gaming transition">
                            UNDO
                        </button>
                        <button ${resetBtnAttr} class="${resetBtnClass} rounded py-1 text-[11px] font-bold font-gaming transition">
                            RESET
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        setInterval(renderBossGrid, 1000);
        setInterval(fetchBosses, 3000);
        fetchBosses();
    </script>
</body>
</html>
