<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คเวลาเกิดบอส</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-6">
    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-emerald-400">⚔️ ระบบเช็คเวลาเกิดบอส (100 เซิร์ฟเวอร์)</h1>
            <p class="text-slate-400 text-sm mt-1">Official (50 ช่อง) | Premium (50 ช่อง) | 4 จุดเกิดบอสหลัก</p>
        </header>

        <!-- แผงควบคุมระบบกรอง (Filter Bar) -->
        <div class="bg-slate-800 p-4 rounded-xl mb-6 grid grid-cols-1 md:grid-cols-3 gap-4 border border-slate-700">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">ประเภทเซิร์ฟเวอร์</label>
                <select id="filter-type" onchange="updateServerOptions(); fetchBosses();" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="All">ทั้งหมด (Official & Premium)</option>
                    <option value="Official">Official</option>
                    <option value="Premium">Premium</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">เลือกห้อง / เซิร์ฟเวอร์</label>
                <select id="filter-server" onchange="fetchBosses();" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="All">ทุกห้อง</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">เลือกเมือง / จุดเกิด</label>
                <select id="filter-location" onchange="fetchBosses();" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="All">ทุกจุดเกิดบอส</option>
                    <option value="Norad Military Base">Norad Military Base</option>
                    <option value="Ridgeway Airport">Ridgeway Airport</option>
                    <option value="Crystal Lake Resort">Crystal Lake Resort</option>
                    <option value="Campos City">Campos City</option>
                </select>
            </div>
        </div>

        <!-- รายการบอส -->
        <div id="boss-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Render บอสผ่าน JavaScript -->
        </div>
    </div>

    <script>
        // สร้างรายชื่อตัวเลือกห้องในตัวกรอง
        function updateServerOptions() {
            const type = document.getElementById('filter-type').value;
            const serverSelect = document.getElementById('filter-server');
            serverSelect.innerHTML = '<option value="All">ทุกห้อง</option>';

            if (type === 'Official' || type === 'All') {
                for (let i = 1; i <= 50; i++) {
                    const name = `Official ${String(i).padStart(3, '0')}`;
                    serverSelect.innerHTML += `<option value="${name}">${name}</option>`;
                }
            }
            if (type === 'Premium' || type === 'All') {
                for (let i = 1; i <= 50; i++) {
                    const name = `Premium ${String(i).padStart(3, '0')}`;
                    serverSelect.innerHTML += `<option value="${name}">${name}</option>`;
                }
            }
        }

        async function fetchBosses() {
            const type = document.getElementById('filter-type').value;
            const server = document.getElementById('filter-server').value;
            const location = document.getElementById('filter-location').value;

            let query = [];
            if (type !== 'All') query.push(`serverType=${type}`);
            if (server !== 'All') query.push(`serverName=${encodeURIComponent(server)}`);
            if (location !== 'All') query.push(`location=${encodeURIComponent(location)}`);

            const url = '/api/bosses' + (query.length ? '?' + query.join('&') : '');
            const res = await fetch(url);
            const data = await res.json();
            renderBosses(data);
        }

        async function killBoss(id) {
            await fetch('/api/bosses/kill', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            fetchBosses();
        }

        async function resetBoss(id) {
            await fetch('/api/bosses/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            fetchBosses();
        }

        function renderBosses(bosses) {
            const container = document.getElementById('boss-list');
            container.innerHTML = '';

            if (bosses.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">ไม่พบข้อมูลบอสตรงกับเงื่อนไขที่เลือก</div>`;
                return;
            }

            bosses.forEach(boss => {
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between shadow-md hover:border-slate-600 transition";

                const isPremium = boss.serverType === 'Premium';
                const tagColor = isPremium ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-blue-500/20 text-blue-400 border-blue-500/30';

                let statusHTML = '';
                let timerHTML = '';

                if (!boss.nextSpawn) {
                    statusHTML = `<span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded border border-emerald-500/30 font-semibold">พร้อมเกิด</span>`;
                    timerHTML = `<div class="text-xl font-bold my-3 text-slate-500">-- : -- : --</div>`;
                } else {
                    const now = new Date().getTime();
                    const spawnTime = new Date(boss.nextSpawn).getTime();
                    const diff = spawnTime - now;

                    if (diff <= 0) {
                        statusHTML = `<span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded border border-emerald-500/30 font-semibold animate-pulse">เกิดแล้ว!</span>`;
                        timerHTML = `<div class="text-xl font-bold my-3 text-emerald-400">READY</div>`;
                    } else {
                        statusHTML = `<span class="bg-rose-500/20 text-rose-400 text-xs px-2 py-0.5 rounded border border-rose-500/30 font-semibold">คูลดาวน์</span>`;
                        
                        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                        
                        const formatted = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                        timerHTML = `<div class="text-xl font-bold my-3 text-amber-400 font-mono">${formatted}</div>`;
                    }
                }

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="inline-block text-[10px] px-1.5 py-0.5 rounded border font-bold ${tagColor} mb-1">${boss.serverName}</span>
                                <h2 class="text-base font-bold text-white leading-tight">${boss.location}</h2>
                            </div>
                            ${statusHTML}
                        </div>
                        ${timerHTML}
                    </div>
                    <div class="flex gap-2 mt-2">
                        <button onclick="killBoss(${boss.id})" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-1.5 rounded-lg text-xs transition">
                            บันทึกตาย
                        </button>
                        <button onclick="resetBoss(${boss.id})" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold px-2.5 py-1.5 rounded-lg text-xs transition">
                            รีเซ็ต
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // เริ่มต้นสร้างตัวเลือก Dropdown และเริ่มนับถอยหลัง
        updateServerOptions();
        setInterval(fetchBosses, 1000);
        fetchBosses();
    </script>
</body>
</html>
